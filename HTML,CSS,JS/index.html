<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yectachy Event Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="mainHeader">
    <h1>Yectachy Community Portal</h1>
    <p>Discover. Register. Connect.</p>
</header>

<nav>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#events">Events</a></li>
        <li><a href="#register">Register</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section id="home">
    <div id="welcomeBanner">
        Welcome to <span class="highlight">Yectachy</span> Event Portal
    </div>
</section>

<section id="events">
    <h2>Upcoming Events</h2>

    <select id="categoryFilter">
        <option value="all">All Events</option>
        <option value="Music">Music</option>
        <option value="Technology">Technology</option>
        <option value="Sports">Sports</option>
    </select>

    <div id="eventContainer"></div>
</section>

<section id="register">
    <h2>Register For Event</h2>

    <form id="registrationForm">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required
               autofocus>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <select id="eventType" required>
            <option value="">Choose Event</option>
            <option>Music Festival</option>
            <option>AI Workshop</option>
            <option>Marathon</option>
        </select>

        <textarea id="feedback"
                  placeholder="Your Message"></textarea>

        <p>Characters: <span id="charCount">0</span></p>

        <button type="submit">Register</button>

    </form>

    <output id="outputMsg"></output>
</section>

<section>
    <h2>Find Nearby Events</h2>
    <button id="locationBtn">Get Location</button>
    <p id="locationOutput"></p>
</section>

<section id="contact">
    <h2>Contact</h2>
    <p>Email: support@yectachy.com</p>
</section>

<footer>
    <p>© 2026 Yectachy Community Portal</p>
</footer>

<script src="main.js"></script>
</body>
</html>
